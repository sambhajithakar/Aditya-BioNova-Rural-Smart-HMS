name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: hms_dev
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U hms -d hms_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HMS_TEST_PORT: "5433"
      HMS_APP_PASSWORD: change_me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install API dependencies
        run: pip install -r apps/api/requirements-dev.txt ruff
      - name: Lint (ruff)
        run: ruff check apps/api --select F,E --line-length 100
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision roles and databases
        run: ./scripts/setup_local_db.sh
      - name: Run test suite (auth, RBAC, cross-tenant RLS)
        working-directory: apps/api
        run: pytest -q

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build

  contracts:
    name: OpenAPI contract snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Generate OpenAPI into packages/contracts
        working-directory: apps/api
        run: |
          python -c "import json, pathlib; from app.main import app; spec = app.openapi(); out = pathlib.Path('../../packages/contracts/openapi.json'); out.write_text(json.dumps(spec, indent=2) + '\n'); print('openapi.json written:', len(spec.get('paths', {})), 'paths')"
      - name: Ensure snapshot is committed
        run: |
          git diff --exit-code packages/contracts/openapi.json \
            || { echo "packages/contracts/openapi.json is stale — regenerate via scripts/generate-contracts.sh"; exit 1; }
